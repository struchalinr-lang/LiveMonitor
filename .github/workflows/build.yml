name: Build LiveMonitor APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Generate Code
        run: |
          mkdir -p app/src/main/java/com/example/livemonitor
          mkdir -p app/src/main/cpp
          
          git clone --depth 1 https://github.com/google/oboe.git app/src/main/cpp/oboe

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "LiveMonitor"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.example.livemonitor'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.livemonitor"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
              externalNativeBuild {
                  cmake {
                      path file('src/main/cpp/CMakeLists.txt')
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <application
                  android:label="LiveMonitor"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/cpp/CMakeLists.txt
          cmake_minimum_required(VERSION 3.18.1)
          project("livemonitor")
          set(OBOE_DIR ./oboe)
          add_subdirectory(${OBOE_DIR} ./oboe)
          include_directories(${OBOE_DIR}/include)
          add_library(livemonitor SHARED livemonitor.cpp)
          find_library(log-lib log)
          target_link_libraries(livemonitor oboe ${log-lib})
          EOF

          cat << 'EOF' > app/src/main/cpp/livemonitor.cpp
          #include <jni.h>
          #include <oboe/Oboe.h>
          #include <memory>
          #include <cstring>

          class LiveEngine : public oboe::AudioStreamCallback {
          private:
              std::shared_ptr<oboe::AudioStream> mRecordingStream;
              std::shared_ptr<oboe::AudioStream> mPlaybackStream;

          public:
              oboe::DataCallbackResult onAudioReady(oboe::AudioStream *audioStream, void *audioData, int32_t numFrames) override {
                  float *outputBuffer = static_cast<float *>(audioData);
                  if (!mRecordingStream) {
                      std::memset(outputBuffer, 0, numFrames * sizeof(float));
                      return oboe::DataCallbackResult::Continue;
                  }
                  auto result = mRecordingStream->read(outputBuffer, numFrames, 0);
                  if (result == oboe::Result::OK) {
                      int32_t framesRead = result.value();
                      if (framesRead < numFrames) {
                          std::memset(outputBuffer + framesRead, 0, (numFrames - framesRead) * sizeof(float));
                      }
                  } else {
                      std::memset(outputBuffer, 0, numFrames * sizeof(float));
                  }
                  return oboe::DataCallbackResult::Continue;
              }

              bool start() {
                  oboe::AudioStreamBuilder outBuilder;
                  outBuilder.setDirection(oboe::Direction::Output)
                          ->setPerformanceMode(oboe::PerformanceMode::LowLatency)
                          ->setSharingMode(oboe::SharingMode::Exclusive)
                          ->setFormat(oboe::AudioFormat::Float)
                          ->setChannelCount(oboe::ChannelCount::Mono)
                          ->setCallback(this);

                  if (outBuilder.openStream(mPlaybackStream) != oboe::Result::OK) {
                      return false;
                  }

                  mPlaybackStream->setBufferSizeInFrames(mPlaybackStream->getFramesPerBurst() * 2);

                  oboe::AudioStreamBuilder inBuilder;
                  inBuilder.setDirection(oboe::Direction::Input)
                          ->setPerformanceMode(oboe::PerformanceMode::LowLatency)
                          ->setSharingMode(oboe::SharingMode::Exclusive)
                          ->setInputPreset(oboe::InputPreset::VoicePerformance)
                          ->setFormat(oboe::AudioFormat::Float)
                          ->setChannelCount(oboe::ChannelCount::Mono)
                          ->setSampleRate(mPlaybackStream->getSampleRate());

                  if (inBuilder.openStream(mRecordingStream) != oboe::Result::OK) {
                      mPlaybackStream->close();
                      mPlaybackStream.reset();
                      return false;
                  }

                  mRecordingStream->requestStart();
                  mPlaybackStream->requestStart();
                  return true;
              }

              void stop() {
                  if (mPlaybackStream) {
                      mPlaybackStream->requestStop();
                      mPlaybackStream->close();
                      mPlaybackStream.reset();
                  }
                  if (mRecordingStream) {
                      mRecordingStream->requestStop();
                      mRecordingStream->close();
                      mRecordingStream.reset();
                  }
              }
          };

          static LiveEngine engine;

          extern "C" JNIEXPORT jboolean JNICALL
          Java_com_example_livemonitor_MainActivity_startMonitoring(JNIEnv *env, jobject thiz) {
              return engine.start();
          }

          extern "C" JNIEXPORT void JNICALL
          Java_com_example_livemonitor_MainActivity_stopMonitoring(JNIEnv *env, jobject thiz) {
              engine.stop();
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/example/livemonitor/MainActivity.java
          package com.example.livemonitor;

          import android.Manifest;
          import android.app.Activity;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Toast;

          public class MainActivity extends Activity {
              static {
                  System.loadLibrary("livemonitor");
              }

              private native boolean startMonitoring();
              private native void stopMonitoring();

              private boolean isMonitoring = false;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{Manifest.permission.RECORD_AUDIO}, 1);
                  }

                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setGravity(Gravity.CENTER);
                  layout.setBackgroundColor(Color.parseColor("#121212"));
                  layout.setPadding(48, 48, 48, 48);

                  final TextView statusText = new TextView(this);
                  statusText.setText("Мониторинг ВЫКЛЮЧЕН");
                  statusText.setTextColor(Color.WHITE);
                  statusText.setTextSize(22f);
                  statusText.setGravity(Gravity.CENTER);
                  statusText.setPadding(0, 0, 0, 48);

                  final Button toggleButton = new Button(this);
                  toggleButton.setText("Запустить");
                  toggleButton.setTextSize(18f);

                  toggleButton.setOnClickListener(v -> {
                      if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                          requestPermissions(new String[]{Manifest.permission.RECORD_AUDIO}, 1);
                          Toast.makeText(this, "Разрешите доступ к микрофону!", Toast.LENGTH_SHORT).show();
                          return;
                      }
                      if (isMonitoring) {
                          stopMonitoring();
                          isMonitoring = false;
                          statusText.setText("Мониторинг ВЫКЛЮЧЕН");
                          statusText.setTextColor(Color.WHITE);
                          toggleButton.setText("Запустить");
                      } else {
                          if (startMonitoring()) {
                              isMonitoring = true;
                              statusText.setText("Мониторинг АКТИВЕН");
                              statusText.setTextColor(Color.parseColor("#4CAF50"));
                              toggleButton.setText("Остановить");
                          } else {
                              Toast.makeText(this, "Ошибка запуска аудиопотока", Toast.LENGTH_SHORT).show();
                          }
                      }
                  });

                  layout.addView(statusText);
                  layout.addView(toggleButton);
                  setContentView(layout);
              }

              @Override
              protected void onDestroy() {
                  super.onDestroy();
                  if (isMonitoring) {
                      stopMonitoring();
                      isMonitoring = false;
                  }
              }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LiveMonitor-APK
          path: app/build/outputs/apk/debug/app-debug.apk
