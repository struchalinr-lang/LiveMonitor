name: Build LiveMonitor APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Generate Code
        run: |
          mkdir -p app/src/main/java/com/example/livemonitor
          mkdir -p app/src/main/cpp
          
          git clone --depth 1 https://github.com/google/oboe.git app/src/main/cpp/oboe

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "LiveMonitor"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.example.livemonitor'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.livemonitor"
                  minSdk 24
                  targetSdk 34
                  versionCode 3
                  versionName "3.0-Karaoke"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
              externalNativeBuild {
                  cmake {
                      path file('src/main/cpp/CMakeLists.txt')
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />

              <queries>
                  <package android:name="com.google.android.apps.youtube.music" />
              </queries>

              <application
                  android:label="Vocal Studio Pro"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:resizeableActivity="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".VocalService"
                      android:enabled="true"
                      android:exported="false"
                      android:foregroundServiceType="microphone" />
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/cpp/CMakeLists.txt
          cmake_minimum_required(VERSION 3.18.1)
          project("livemonitor")
          set(CMAKE_CXX_STANDARD 17)
          set(OBOE_DIR ./oboe)
          add_subdirectory(${OBOE_DIR} ./oboe)
          include_directories(${OBOE_DIR}/include)
          add_library(livemonitor SHARED livemonitor.cpp)
          find_library(log-lib log)
          target_link_libraries(livemonitor oboe ${log-lib})
          EOF

          cat << 'EOF' > app/src/main/cpp/livemonitor.cpp
          #include <jni.h>
          #include <oboe/Oboe.h>
          #include <memory>
          #include <cstring>
          #include <cmath>
          #include <atomic>
          #include <vector>

          class LiveEngine : public oboe::AudioStreamCallback {
          private:
              std::shared_ptr<oboe::AudioStream> mRecordingStream;
              std::shared_ptr<oboe::AudioStream> mPlaybackStream;

              std::atomic<float> mGain{1.3f};
              std::atomic<float> mReverbMix{0.30f};
              std::atomic<float> mHarmonyMix{0.40f};
              std::atomic<int> mHarmonyMode{0};
              std::atomic<float> mBrightness{0.35f};
              std::atomic<float> mPeakLevel{0.0f};
              std::atomic<bool> mMixWithMusic{true};

              static constexpr int PITCH_BUF_SIZE = 4096;
              static constexpr int PITCH_BUF_MASK = PITCH_BUF_SIZE - 1;
              static constexpr float GRAIN_SIZE = 1024.0f;
              float mPitchBuf[PITCH_BUF_SIZE];
              int mPitchWriteIdx = 0;
              float mPitchPhase = 0.0f;

              float mPrevInput = 0.0f;

              std::vector<float> mComb1, mComb2, mComb3, mComb4;
              int mCombIdx1 = 0, mCombIdx2 = 0, mCombIdx3 = 0, mCombIdx4 = 0;
              float mCombStore1 = 0.0f, mCombStore2 = 0.0f, mCombStore3 = 0.0f, mCombStore4 = 0.0f;

              std::vector<float> mAllPass1, mAllPass2;
              int mApIdx1 = 0, mApIdx2 = 0;

              int mWarmupCallbacks = 0;

              void initDSP() {
                  std::memset(mPitchBuf, 0, sizeof(mPitchBuf));
                  mPitchWriteIdx = 0;
                  mPitchPhase = 0.0f;
                  mPrevInput = 0.0f;

                  mComb1.assign(1557, 0.0f);
                  mComb2.assign(1617, 0.0f);
                  mComb3.assign(1491, 0.0f);
                  mComb4.assign(1422, 0.0f);
                  mCombIdx1 = mCombIdx2 = mCombIdx3 = mCombIdx4 = 0;
                  mCombStore1 = mCombStore2 = mCombStore3 = mCombStore4 = 0.0f;

                  mAllPass1.assign(225, 0.0f);
                  mAllPass2.assign(556, 0.0f);
                  mApIdx1 = mApIdx2 = 0;
              }

              inline float readPitchSample(float delaySamples) {
                  float readPos = static_cast<float>(mPitchWriteIdx) - delaySamples;
                  while (readPos < 0.0f) readPos += PITCH_BUF_SIZE;
                  int idx0 = static_cast<int>(readPos) & PITCH_BUF_MASK;
                  int idx1 = (idx0 + 1) & PITCH_BUF_MASK;
                  float frac = readPos - std::floor(readPos);
                  return mPitchBuf[idx0] * (1.0f - frac) + mPitchBuf[idx1] * frac;
              }

              inline float processPitchShift(float input, float pitchRatio) {
                  mPitchBuf[mPitchWriteIdx] = input;
                  float phaseInc = (1.0f - pitchRatio) / GRAIN_SIZE;
                  mPitchPhase += phaseInc;
                  if (mPitchPhase >= 1.0f) mPitchPhase -= 1.0f;
                  if (mPitchPhase < 0.0f) mPitchPhase += 1.0f;

                  float phaseA = mPitchPhase;
                  float phaseB = mPitchPhase + 0.5f;
                  if (phaseB >= 1.0f) phaseB -= 1.0f;

                  float delayA = phaseA * GRAIN_SIZE + 64.0f;
                  float delayB = phaseB * GRAIN_SIZE + 64.0f;

                  float weightA = 0.5f * (1.0f - std::cos(2.0f * 3.14159265f * phaseA));
                  float weightB = 0.5f * (1.0f - std::cos(2.0f * 3.14159265f * phaseB));

                  float sample = readPitchSample(delayA) * weightA + readPitchSample(delayB) * weightB;
                  mPitchWriteIdx = (mPitchWriteIdx + 1) & PITCH_BUF_MASK;
                  return sample;
              }

              inline float processComb(float input, std::vector<float>& buf, int& idx, float& filterStore, float feedback, float damp) {
                  float output = buf[idx];
                  filterStore = (output * (1.0f - damp)) + (filterStore * damp);
                  buf[idx] = input + (filterStore * feedback);
                  if (++idx >= static_cast<int>(buf.size())) idx = 0;
                  return output;
              }

              inline float processAllPass(float input, std::vector<float>& buf, int& idx) {
                  float bufOut = buf[idx];
                  float output = -input + bufOut;
                  buf[idx] = input + (bufOut * 0.5f);
                  if (++idx >= static_cast<int>(buf.size())) idx = 0;
                  return output;
              }

              inline float processReverb(float input, float reverbAmount) {
                  float feedback = 0.72f + reverbAmount * 0.16f;
                  float damp = 0.25f;
                  float out = 0.0f;
                  out += processComb(input, mComb1, mCombIdx1, mCombStore1, feedback, damp);
                  out += processComb(input, mComb2, mCombIdx2, mCombStore2, feedback, damp);
                  out += processComb(input, mComb3, mCombIdx3, mCombStore3, feedback, damp);
                  out += processComb(input, mComb4, mCombIdx4, mCombStore4, feedback, damp);
                  out = processAllPass(out, mAllPass1, mApIdx1);
                  out = processAllPass(out, mAllPass2, mApIdx2);
                  return out * 0.22f;
              }

          public:
              LiveEngine() {
                  initDSP();
              }

              oboe::DataCallbackResult onAudioReady(oboe::AudioStream *audioStream, void *audioData, int32_t numFrames) override {
                  float *outputBuffer = static_cast<float *>(audioData);
                  if (!mRecordingStream) {
                      std::memset(outputBuffer, 0, numFrames * sizeof(float));
                      return oboe::DataCallbackResult::Continue;
                  }

                  if (mWarmupCallbacks < 6) {
                      float discardBuf[512];
                      while (mRecordingStream->read(discardBuf, 512, 0).value() == 512) {}
                      mWarmupCallbacks++;
                  }

                  auto result = mRecordingStream->read(outputBuffer, numFrames, 0);
                  int32_t framesRead = (result == oboe::Result::OK) ? result.value() : 0;
                  if (framesRead < numFrames) {
                      std::memset(outputBuffer + framesRead, 0, (numFrames - framesRead) * sizeof(float));
                  }

                  float gain = mGain.load();
                  float revMix = mReverbMix.load();
                  float harmMix = mHarmonyMix.load();
                  int harmMode = mHarmonyMode.load();
                  float bright = mBrightness.load();

                  float pitchRatio = 1.0f;
                  if (harmMode == 1) pitchRatio = 1.008f;
                  else if (harmMode == 2) pitchRatio = 1.2599f;
                  else if (harmMode == 3) pitchRatio = 1.4983f;
                  else if (harmMode == 4) pitchRatio = 0.5000f;

                  float maxPeak = 0.0f;

                  for (int32_t i = 0; i < numFrames; ++i) {
                      float raw = outputBuffer[i] * gain;

                      float highFreq = raw - mPrevInput;
                      mPrevInput = raw;
                      float dry = raw + highFreq * (bright * 0.8f);

                      float harmony = 0.0f;
                      if (harmMode > 0 && harmMix > 0.01f) {
                          harmony = processPitchShift(dry, pitchRatio) * harmMix;
                      } else {
                          mPitchBuf[mPitchWriteIdx] = dry;
                          mPitchWriteIdx = (mPitchWriteIdx + 1) & PITCH_BUF_MASK;
                      }

                      float combined = dry + harmony;

                      float wet = 0.0f;
                      if (revMix > 0.01f) {
                          wet = processReverb(combined, revMix) * revMix;
                      }

                      float finalOut = std::tanh(combined + wet);
                      outputBuffer[i] = finalOut;

                      float absVal = std::fabs(finalOut);
                      if (absVal > maxPeak) maxPeak = absVal;
                  }

                  float currentPeak = mPeakLevel.load();
                  if (maxPeak > currentPeak) {
                      mPeakLevel.store(maxPeak);
                  } else {
                      mPeakLevel.store(currentPeak * 0.85f);
                  }

                  return oboe::DataCallbackResult::Continue;
              }

              bool start() {
                  stop();
                  initDSP();
                  mWarmupCallbacks = 0;

                  // Output uses Shared mode by default so YouTube Music plays simultaneously via Android Fast Mixer
                  oboe::SharingMode outSharing = mMixWithMusic.load() ? oboe::SharingMode::Shared : oboe::SharingMode::Exclusive;

                  oboe::AudioStreamBuilder outBuilder;
                  outBuilder.setDirection(oboe::Direction::Output)
                          ->setPerformanceMode(oboe::PerformanceMode::LowLatency)
                          ->setSharingMode(outSharing)
                          ->setUsage(oboe::Usage::Media)
                          ->setFormat(oboe::AudioFormat::Float)
                          ->setChannelCount(oboe::ChannelCount::Mono)
                          ->setCallback(this);

                  if (outBuilder.openStream(mPlaybackStream) != oboe::Result::OK) {
                      return false;
                  }

                  mPlaybackStream->setBufferSizeInFrames(mPlaybackStream->getFramesPerBurst() * 2);

                  // Input keeps Exclusive mode for ultra-low microphone latency
                  oboe::AudioStreamBuilder inBuilder;
                  inBuilder.setDirection(oboe::Direction::Input)
                          ->setPerformanceMode(oboe::PerformanceMode::LowLatency)
                          ->setSharingMode(oboe::SharingMode::Exclusive)
                          ->setInputPreset(oboe::InputPreset::VoicePerformance)
                          ->setFormat(oboe::AudioFormat::Float)
                          ->setChannelCount(oboe::ChannelCount::Mono)
                          ->setSampleRate(mPlaybackStream->getSampleRate());

                  if (inBuilder.openStream(mRecordingStream) != oboe::Result::OK) {
                      mPlaybackStream->close();
                      mPlaybackStream.reset();
                      return false;
                  }

                  mRecordingStream->requestStart();
                  mPlaybackStream->requestStart();
                  return true;
              }

              void stop() {
                  if (mPlaybackStream) {
                      mPlaybackStream->requestStop();
                      mPlaybackStream->close();
                      mPlaybackStream.reset();
                  }
                  if (mRecordingStream) {
                      mRecordingStream->requestStop();
                      mRecordingStream->close();
                      mRecordingStream.reset();
                  }
                  mPeakLevel.store(0.0f);
              }

              void setGain(float val) { mGain.store(val); }
              void setReverb(float val) { mReverbMix.store(val); }
              void setHarmonyMix(float val) { mHarmonyMix.store(val); }
              void setHarmonyMode(int mode) { mHarmonyMode.store(mode); }
              void setBrightness(float val) { mBrightness.store(val); }
              void setMixWithMusic(bool mix) { mMixWithMusic.store(mix); }
              float getPeak() { return mPeakLevel.load(); }
          };

          static LiveEngine engine;

          extern "C" JNIEXPORT jboolean JNICALL
          Java_com_example_livemonitor_MainActivity_startMonitoring(JNIEnv *env, jobject thiz) {
              return engine.start();
          }

          extern "C" JNIEXPORT void JNICALL
          Java_com_example_livemonitor_MainActivity_stopMonitoring(JNIEnv *env, jobject thiz) {
              engine.stop();
          }

          extern "C" JNIEXPORT void JNICALL
          Java_com_example_livemonitor_MainActivity_setGain(JNIEnv *env, jobject thiz, jfloat val) {
              engine.setGain(val);
          }

          extern "C" JNIEXPORT void JNICALL
          Java_com_example_livemonitor_MainActivity_setReverb(JNIEnv *env, jobject thiz, jfloat val) {
              engine.setReverb(val);
          }

          extern "C" JNIEXPORT void JNICALL
          Java_com_example_livemonitor_MainActivity_setHarmonyMix(JNIEnv *env, jobject thiz, jfloat val) {
              engine.setHarmonyMix(val);
          }

          extern "C" JNIEXPORT void JNICALL
          Java_com_example_livemonitor_MainActivity_setHarmonyMode(JNIEnv *env, jobject thiz, jint mode) {
              engine.setHarmonyMode(mode);
          }

          extern "C" JNIEXPORT void JNICALL
          Java_com_example_livemonitor_MainActivity_setBrightness(JNIEnv *env, jobject thiz, jfloat val) {
              engine.setBrightness(val);
          }

          extern "C" JNIEXPORT void JNICALL
          Java_com_example_livemonitor_MainActivity_setMixWithMusic(JNIEnv *env, jobject thiz, jboolean mix) {
              engine.setMixWithMusic(mix);
          }

          extern "C" JNIEXPORT jfloat JNICALL
          Java_com_example_livemonitor_MainActivity_getPeakLevel(JNIEnv *env, jobject thiz) {
              return engine.getPeak();
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/example/livemonitor/VocalService.java
          package com.example.livemonitor;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Intent;
          import android.content.pm.ServiceInfo;
          import android.os.Build;
          import android.os.IBinder;

          public class VocalService extends Service {
              private static final String CHANNEL_ID = "VocalStudioChannel";

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  createNotificationChannel();

                  Intent openIntent = new Intent(this, MainActivity.class);
                  int piFlags = Build.VERSION.SDK_INT >= 23 ? PendingIntent.FLAG_IMMUTABLE : 0;
                  PendingIntent pendingIntent = PendingIntent.getActivity(this, 0, openIntent, piFlags);

                  Notification.Builder builder = Build.VERSION.SDK_INT >= 26
                          ? new Notification.Builder(this, CHANNEL_ID)
                          : new Notification.Builder(this);

                  Notification notification = builder
                          .setContentTitle("Vocal Studio Pro активен")
                          .setContentText("Микрофон работает в фоне поверх YouTube Music")
                          .setSmallIcon(android.R.drawable.ic_btn_speak_now)
                          .setContentIntent(pendingIntent)
                          .setOngoing(true)
                          .build();

                  if (Build.VERSION.SDK_INT >= 30) {
                      startForeground(101, notification, ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE);
                  } else {
                      startForeground(101, notification);
                  }

                  return START_STICKY;
              }

              private void createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= 26) {
                      NotificationChannel channel = new NotificationChannel(
                              CHANNEL_ID,
                              "Вокальный мониторинг",
                              NotificationManager.IMPORTANCE_LOW
                      );
                      NotificationManager manager = getSystemService(NotificationManager.class);
                      if (manager != null) {
                          manager.createNotificationChannel(channel);
                      }
                  }
              }

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/example/livemonitor/MainActivity.java
          package com.example.livemonitor;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.content.res.ColorStateList;
          import android.graphics.Color;
          import android.graphics.PixelFormat;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowManager;
          import android.widget.Button;
          import android.widget.HorizontalScrollView;
          import android.widget.LinearLayout;
          import android.widget.ProgressBar;
          import android.widget.ScrollView;
          import android.widget.SeekBar;
          import android.widget.TextView;
          import android.widget.Toast;

          public class MainActivity extends Activity {
              static {
                  System.loadLibrary("livemonitor");
              }

              private native boolean startMonitoring();
              private native void stopMonitoring();
              private native void setGain(float val);
              private native void setReverb(float val);
              private native void setHarmonyMix(float val);
              private native void setHarmonyMode(int mode);
              private native void setBrightness(float val);
              private native void setMixWithMusic(boolean mix);
              private native float getPeakLevel();

              private boolean isMonitoring = false;
              private int selectedHarmony = 0;
              private int currentReverbPct = 30;
              private Button[] harmonyButtons = new Button[5];
              private String[] harmonyNames = {"Выкл", "Дабл / Хор", "Терция (+4)", "Квинта (+7)", "Октава (-12)"};

              private ProgressBar levelBar;
              private TextView levelValueText;
              private TextView statusBadge;
              private Button mainButton;
              private SeekBar reverbSeekBar;
              private Handler uiHandler = new Handler(Looper.getMainLooper());

              // Floating Overlay Widget
              private WindowManager windowManager;
              private View floatingView;
              private TextView floatHarmText;
              private TextView floatRevText;
              private boolean isOverlayExpanded = false;

              // Material 3 Dark Colors
              private final int COLOR_BG = Color.parseColor("#0F0D13");
              private final int COLOR_CARD = Color.parseColor("#1D1B20");
              private final int COLOR_CARD_HIGHLIGHT = Color.parseColor("#2B2930");
              private final int COLOR_PRIMARY = Color.parseColor("#D0BCFF");
              private final int COLOR_ON_PRIMARY = Color.parseColor("#381E72");
              private final int COLOR_SECONDARY = Color.parseColor("#CCC2DC");
              private final int COLOR_TEXT = Color.parseColor("#E6E0E9");
              private final int COLOR_TEXT_MUTED = Color.parseColor("#938F99");
              private final int COLOR_ACTIVE_GREEN = Color.parseColor("#6DD58C");
              private final int COLOR_STOP_RED = Color.parseColor("#F2B8B5");
              private final int COLOR_ON_STOP_RED = Color.parseColor("#601410");
              private final int COLOR_YT_RED = Color.parseColor("#FF4E45");

              private int dp(int value) {
                  return (int) (value * getResources().getDisplayMetrics().density);
              }

              private GradientDrawable createRoundedRect(int bgColor, int radiusDp, int strokeColor, int strokeWidthDp) {
                  GradientDrawable gd = new GradientDrawable();
                  gd.setColor(bgColor);
                  gd.setCornerRadius(dp(radiusDp));
                  if (strokeWidthDp > 0) {
                      gd.setStroke(dp(strokeWidthDp), strokeColor);
                  }
                  return gd;
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  Window window = getWindow();
                  window.setStatusBarColor(COLOR_BG);
                  window.setNavigationBarColor(COLOR_BG);

                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      if (Build.VERSION.SDK_INT >= 33) {
                          requestPermissions(new String[]{Manifest.permission.RECORD_AUDIO, Manifest.permission.POST_NOTIFICATIONS}, 1);
                      } else {
                          requestPermissions(new String[]{Manifest.permission.RECORD_AUDIO}, 1);
                      }
                  }

                  ScrollView scrollView = new ScrollView(this);
                  scrollView.setBackgroundColor(COLOR_BG);
                  scrollView.setFillViewport(true);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(dp(20), dp(24), dp(20), dp(32));

                  // --- HEADER SECTION ---
                  LinearLayout headerRow = new LinearLayout(this);
                  headerRow.setOrientation(LinearLayout.HORIZONTAL);
                  headerRow.setGravity(Gravity.CENTER_VERTICAL);

                  LinearLayout titleCol = new LinearLayout(this);
                  titleCol.setOrientation(LinearLayout.VERTICAL);
                  titleCol.setLayoutParams(new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f));

                  TextView appTitle = new TextView(this);
                  appTitle.setText("Vocal Studio Pro");
                  appTitle.setTextColor(COLOR_TEXT);
                  appTitle.setTextSize(25f);
                  appTitle.setTypeface(Typeface.create("sans-serif-medium", Typeface.BOLD));

                  TextView appSub = new TextView(this);
                  appSub.setText("Oboe C++ • Караоке с YouTube Music");
                  appSub.setTextColor(COLOR_TEXT_MUTED);
                  appSub.setTextSize(13f);

                  titleCol.addView(appTitle);
                  titleCol.addView(appSub);

                  statusBadge = new TextView(this);
                  statusBadge.setText("● ОЖИДАНИЕ");
                  statusBadge.setTextColor(COLOR_TEXT_MUTED);
                  statusBadge.setTextSize(12f);
                  statusBadge.setTypeface(Typeface.DEFAULT_BOLD);
                  statusBadge.setPadding(dp(14), dp(8), dp(14), dp(8));
                  statusBadge.setBackground(createRoundedRect(COLOR_CARD_HIGHLIGHT, 50, 0, 0));

                  headerRow.addView(titleCol);
                  headerRow.addView(statusBadge);
                  root.addView(headerRow);

                  addSpacer(root, 18);

                  // --- CARD 0: YOUTUBE MUSIC KARAOKE LAUNCHER ---
                  LinearLayout ytCard = createCard();
                  ytCard.setBackground(createRoundedRect(Color.parseColor("#25181C"), 24, COLOR_YT_RED, 1));

                  TextView ytTitle = new TextView(this);
                  ytTitle.setText("🎵 Режим Караоке с YouTube Music");
                  ytTitle.setTextColor(Color.WHITE);
                  ytTitle.setTextSize(16f);
                  ytTitle.setTypeface(Typeface.DEFAULT_BOLD);
                  ytCard.addView(ytTitle);

                  TextView ytDesc = new TextView(this);
                  ytDesc.setText("Запускает фоновый мониторинг голоса, выводит плавающий мини-пульт поверх экрана и открывает YouTube Music с текстами песен.");
                  ytDesc.setTextColor(COLOR_SECONDARY);
                  ytDesc.setTextSize(12f);
                  ytCard.addView(ytDesc);

                  addSpacer(ytCard, 12);

                  Button ytButton = new Button(this);
                  ytButton.setText("🚀  Петь в YouTube Music (+ Мини-пульт)");
                  ytButton.setAllCaps(false);
                  ytButton.setTextSize(14f);
                  ytButton.setTypeface(Typeface.DEFAULT_BOLD);
                  ytButton.setTextColor(Color.WHITE);
                  ytButton.setBackground(createRoundedRect(COLOR_YT_RED, 20, 0, 0));
                  ytButton.setLayoutParams(new LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, dp(48)));
                  ytButton.setOnClickListener(v -> launchYouTubeMusicKaraoke());
                  ytCard.addView(ytButton);

                  root.addView(ytCard);
                  addSpacer(root, 16);

                  // --- CARD 1: LIVE VU METER ---
                  LinearLayout meterCard = createCard();
                  LinearLayout meterHeader = new LinearLayout(this);
                  meterHeader.setOrientation(LinearLayout.HORIZONTAL);

                  TextView meterTitle = new TextView(this);
                  meterTitle.setText("🎙 Уровень вокала (Live Input)");
                  meterTitle.setTextColor(COLOR_SECONDARY);
                  meterTitle.setTextSize(14f);
                  meterTitle.setTypeface(Typeface.DEFAULT_BOLD);
                  meterTitle.setLayoutParams(new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f));

                  levelValueText = new TextView(this);
                  levelValueText.setText("0%");
                  levelValueText.setTextColor(COLOR_PRIMARY);
                  levelValueText.setTextSize(14f);
                  levelValueText.setTypeface(Typeface.DEFAULT_BOLD);

                  meterHeader.addView(meterTitle);
                  meterHeader.addView(levelValueText);
                  meterCard.addView(meterHeader);

                  addSpacer(meterCard, 10);

                  levelBar = new ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal);
                  levelBar.setMax(100);
                  levelBar.setProgress(0);
                  levelBar.setProgressTintList(ColorStateList.valueOf(COLOR_PRIMARY));
                  levelBar.setProgressBackgroundTintList(ColorStateList.valueOf(COLOR_CARD_HIGHLIGHT));
                  levelBar.setLayoutParams(new LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, dp(12)));
                  meterCard.addView(levelBar);

                  root.addView(meterCard);
                  addSpacer(root, 16);

                  // --- CARD 2: HARMONY SELECTOR ---
                  LinearLayout harmonyCard = createCard();
                  TextView harmTitle = new TextView(this);
                  harmTitle.setText("🎶 Вокальная гармония (Pitch Shifter)");
                  harmTitle.setTextColor(COLOR_SECONDARY);
                  harmTitle.setTextSize(15f);
                  harmTitle.setTypeface(Typeface.DEFAULT_BOLD);
                  harmonyCard.addView(harmTitle);

                  addSpacer(harmonyCard, 12);

                  HorizontalScrollView chipScroll = new HorizontalScrollView(this);
                  chipScroll.setHorizontalScrollBarEnabled(false);
                  LinearLayout chipRow = new LinearLayout(this);
                  chipRow.setOrientation(LinearLayout.HORIZONTAL);

                  for (int i = 0; i < harmonyNames.length; i++) {
                      final int index = i;
                      Button chip = new Button(this);
                      chip.setText(harmonyNames[i]);
                      chip.setAllCaps(false);
                      chip.setTextSize(13f);
                      chip.setPadding(dp(16), dp(8), dp(16), dp(8));
                      LinearLayout.LayoutParams chipParams = new LinearLayout.LayoutParams(
                              LinearLayout.LayoutParams.WRAP_CONTENT, dp(42));
                      chipParams.setMargins(0, 0, dp(8), 0);
                      chip.setLayoutParams(chipParams);
                      chip.setOnClickListener(v -> selectHarmonyChip(index));
                      harmonyButtons[i] = chip;
                      chipRow.addView(chip);
                  }
                  chipScroll.addView(chipRow);
                  harmonyCard.addView(chipScroll);
                  selectHarmonyChip(0);

                  addSpacer(harmonyCard, 14);

                  addSlider(harmonyCard, "Громкость второго голоса", 40, 100, "%", progress -> {
                      setHarmonyMix(progress / 100.0f);
                  });

                  root.addView(harmonyCard);
                  addSpacer(root, 16);

                  // --- CARD 3: STUDIO EFFECTS ---
                  LinearLayout fxCard = createCard();
                  TextView fxTitle = new TextView(this);
                  fxTitle.setText("🎛 Студийная обработка");
                  fxTitle.setTextColor(COLOR_SECONDARY);
                  fxTitle.setTextSize(15f);
                  fxTitle.setTypeface(Typeface.DEFAULT_BOLD);
                  fxCard.addView(fxTitle);

                  addSpacer(fxCard, 12);

                  reverbSeekBar = addSlider(fxCard, "✨ Реверберация (Studio Hall)", 30, 100, "%", progress -> {
                      currentReverbPct = progress;
                      setReverb(progress / 100.0f);
                      if (floatRevText != null) floatRevText.setText("Эхо: " + progress + "%");
                  });

                  addSpacer(fxCard, 12);

                  addSlider(fxCard, "🎤 Усиление микрофона (Gain)", 130, 250, "%", progress -> {
                      setGain(progress / 100.0f);
                  });

                  addSpacer(fxCard, 12);

                  addSlider(fxCard, "💎 Яркость и воздух (Air EQ)", 35, 100, "%", progress -> {
                      setBrightness(progress / 100.0f);
                  });

                  root.addView(fxCard);
                  addSpacer(root, 20);

                  // --- MAIN START / STOP BUTTON ---
                  mainButton = new Button(this);
                  mainButton.setText("▶  ЗАПУСТИТЬ МОНИТОРИНГ");
                  mainButton.setTextSize(16f);
                  mainButton.setAllCaps(false);
                  mainButton.setTypeface(Typeface.DEFAULT_BOLD);
                  mainButton.setTextColor(COLOR_ON_PRIMARY);
                  mainButton.setBackground(createRoundedRect(COLOR_PRIMARY, 28, 0, 0));
                  mainButton.setLayoutParams(new LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, dp(58)));

                  mainButton.setOnClickListener(v -> toggleEngine());

                  root.addView(mainButton);

                  scrollView.addView(root);
                  setContentView(scrollView);

                  uiHandler.post(levelUpdater);
              }

              private void toggleEngine() {
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{Manifest.permission.RECORD_AUDIO}, 1);
                      Toast.makeText(this, "Разрешите доступ к микрофону!", Toast.LENGTH_SHORT).show();
                      return;
                  }
                  if (isMonitoring) {
                      stopMonitoring();
                      stopService(new Intent(this, VocalService.class));
                      isMonitoring = false;
                      updateStatusUI();
                  } else {
                      Intent serviceIntent = new Intent(this, VocalService.class);
                      if (Build.VERSION.SDK_INT >= 26) {
                          startForegroundService(serviceIntent);
                      } else {
                          startService(serviceIntent);
                      }
                      if (startMonitoring()) {
                          isMonitoring = true;
                          updateStatusUI();
                      } else {
                          Toast.makeText(this, "Ошибка запуска аудиопотока", Toast.LENGTH_SHORT).show();
                      }
                  }
              }

              private void updateStatusUI() {
                  if (isMonitoring) {
                      statusBadge.setText("● LIVE В ФОНЕ");
                      statusBadge.setTextColor(Color.parseColor("#0A3818"));
                      statusBadge.setBackground(createRoundedRect(COLOR_ACTIVE_GREEN, 50, 0, 0));
                      mainButton.setText("⏹  ОСТАНОВИТЬ МОНИТОРИНГ");
                      mainButton.setTextColor(COLOR_ON_STOP_RED);
                      mainButton.setBackground(createRoundedRect(COLOR_STOP_RED, 28, 0, 0));
                  } else {
                      statusBadge.setText("● ОЖИДАНИЕ");
                      statusBadge.setTextColor(COLOR_TEXT_MUTED);
                      statusBadge.setBackground(createRoundedRect(COLOR_CARD_HIGHLIGHT, 50, 0, 0));
                      mainButton.setText("▶  ЗАПУСТИТЬ МОНИТОРИНГ");
                      mainButton.setTextColor(COLOR_ON_PRIMARY);
                      mainButton.setBackground(createRoundedRect(COLOR_PRIMARY, 28, 0, 0));
                  }
              }

              private void launchYouTubeMusicKaraoke() {
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{Manifest.permission.RECORD_AUDIO}, 1);
                      Toast.makeText(this, "Сначала разрешите доступ к микрофону!", Toast.LENGTH_SHORT).show();
                      return;
                  }

                  // Check permission for floating mini-controller
                  if (Build.VERSION.SDK_INT >= 23 && !Settings.canDrawOverlays(this)) {
                      Toast.makeText(this, "Включите разрешение «Поверх других окон» для мини-пульта и нажмите кнопку еще раз!", Toast.LENGTH_LONG).show();
                      Intent intent = new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:" + getPackageName()));
                      startActivity(intent);
                      return;
                  }

                  if (!isMonitoring) {
                      toggleEngine();
                  }

                  showFloatingMiniController();

                  Intent ytIntent = getPackageManager().getLaunchIntentForPackage("com.google.android.apps.youtube.music");
                  if (ytIntent != null) {
                      startActivity(ytIntent);
                  } else {
                      Intent webIntent = new Intent(Intent.ACTION_VIEW, Uri.parse("https://music.youtube.com"));
                      startActivity(webIntent);
                  }
              }

              private void showFloatingMiniController() {
                  if (floatingView != null) return;

                  windowManager = (WindowManager) getSystemService(WINDOW_SERVICE);
                  int layoutType = Build.VERSION.SDK_INT >= 26
                          ? WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                          : WindowManager.LayoutParams.TYPE_PHONE;

                  final WindowManager.LayoutParams params = new WindowManager.LayoutParams(
                          WindowManager.LayoutParams.WRAP_CONTENT,
                          WindowManager.LayoutParams.WRAP_CONTENT,
                          layoutType,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                          PixelFormat.TRANSLUCENT
                  );
                  params.gravity = Gravity.TOP | Gravity.START;
                  params.x = dp(16);
                  params.y = dp(180);

                  final LinearLayout container = new LinearLayout(this);
                  container.setOrientation(LinearLayout.VERTICAL);
                  container.setPadding(dp(12), dp(10), dp(12), dp(10));
                  container.setBackground(createRoundedRect(Color.parseColor("#E61D1B20"), 22, COLOR_PRIMARY, 1));

                  final TextView pillBtn = new TextView(this);
                  pillBtn.setText("🎤 Studio");
                  pillBtn.setTextColor(COLOR_PRIMARY);
                  pillBtn.setTextSize(14f);
                  pillBtn.setTypeface(Typeface.DEFAULT_BOLD);
                  container.addView(pillBtn);

                  final LinearLayout controlsBox = new LinearLayout(this);
                  controlsBox.setOrientation(LinearLayout.VERTICAL);
                  controlsBox.setVisibility(View.GONE);
                  controlsBox.setPadding(0, dp(8), 0, 0);

                  floatHarmText = new TextView(this);
                  floatHarmText.setText("Гарм: " + harmonyNames[selectedHarmony]);
                  floatHarmText.setTextColor(Color.WHITE);
                  floatHarmText.setTextSize(12f);
                  floatHarmText.setPadding(dp(10), dp(6), dp(10), dp(6));
                  floatHarmText.setBackground(createRoundedRect(COLOR_CARD_HIGHLIGHT, 12, 0, 0));
                  floatHarmText.setOnClickListener(v -> {
                      int next = (selectedHarmony + 1) % harmonyNames.length;
                      selectHarmonyChip(next);
                  });
                  controlsBox.addView(floatHarmText);

                  View sp1 = new View(this);
                  sp1.setLayoutParams(new LinearLayout.LayoutParams(dp(10), dp(6)));
                  controlsBox.addView(sp1);

                  floatRevText = new TextView(this);
                  floatRevText.setText("Эхо: " + currentReverbPct + "%");
                  floatRevText.setTextColor(Color.WHITE);
                  floatRevText.setTextSize(12f);
                  floatRevText.setPadding(dp(10), dp(6), dp(10), dp(6));
                  floatRevText.setBackground(createRoundedRect(COLOR_CARD_HIGHLIGHT, 12, 0, 0));
                  floatRevText.setOnClickListener(v -> {
                      int nextRev = (currentReverbPct + 20) % 100;
                      currentReverbPct = nextRev;
                      if (reverbSeekBar != null) reverbSeekBar.setProgress(nextRev);
                      setReverb(nextRev / 100.0f);
                      floatRevText.setText("Эхо: " + nextRev + "%");
                  });
                  controlsBox.addView(floatRevText);

                  View sp2 = new View(this);
                  sp2.setLayoutParams(new LinearLayout.LayoutParams(dp(10), dp(6)));
                  controlsBox.addView(sp2);

                  TextView closeFloat = new TextView(this);
                  closeFloat.setText("✕ Скрыть пульт");
                  closeFloat.setTextColor(COLOR_STOP_RED);
                  closeFloat.setTextSize(11f);
                  closeFloat.setGravity(Gravity.CENTER);
                  closeFloat.setPadding(dp(8), dp(4), dp(8), dp(4));
                  closeFloat.setOnClickListener(v -> removeFloatingMiniController());
                  controlsBox.addView(closeFloat);

                  container.addView(controlsBox);

                  pillBtn.setOnTouchListener(new View.OnTouchListener() {
                      private int initialX, initialY;
                      private float initialTouchX, initialTouchY;
                      private long touchStartTime;

                      @Override
                      public boolean onTouch(View v, MotionEvent event) {
                          switch (event.getAction()) {
                              case MotionEvent.ACTION_DOWN:
                                  initialX = params.x;
                                  initialY = params.y;
                                  initialTouchX = event.getRawX();
                                  initialTouchY = event.getRawY();
                                  touchStartTime = System.currentTimeMillis();
                                  return true;
                              case MotionEvent.ACTION_MOVE:
                                  params.x = initialX + (int) (event.getRawX() - initialTouchX);
                                  params.y = initialY + (int) (event.getRawY() - initialTouchY);
                                  windowManager.updateViewLayout(container, params);
                                  return true;
                              case MotionEvent.ACTION_UP:
                                  if (System.currentTimeMillis() - touchStartTime < 200) {
                                      isOverlayExpanded = !isOverlayExpanded;
                                      controlsBox.setVisibility(isOverlayExpanded ? View.VISIBLE : View.GONE);
                                  }
                                  return true;
                          }
                          return false;
                      }
                  });

                  floatingView = container;
                  windowManager.addView(floatingView, params);
              }

              private void removeFloatingMiniController() {
                  if (floatingView != null && windowManager != null) {
                      windowManager.removeView(floatingView);
                      floatingView = null;
                  }
              }

              private final Runnable levelUpdater = new Runnable() {
                  @Override
                  public void run() {
                      if (isMonitoring) {
                          float peak = getPeakLevel();
                          int pct = Math.min(100, (int) (peak * 115.0f));
                          levelBar.setProgress(pct);
                          levelValueText.setText(pct + "%");
                          if (pct > 85) {
                              levelBar.setProgressTintList(ColorStateList.valueOf(COLOR_STOP_RED));
                          } else if (pct > 45) {
                              levelBar.setProgressTintList(ColorStateList.valueOf(COLOR_ACTIVE_GREEN));
                          } else {
                              levelBar.setProgressTintList(ColorStateList.valueOf(COLOR_PRIMARY));
                          }
                      } else {
                          levelBar.setProgress(0);
                          levelValueText.setText("0%");
                      }
                      uiHandler.postDelayed(this, 40);
                  }
              };

              private void selectHarmonyChip(int index) {
                  selectedHarmony = index;
                  setHarmonyMode(index);
                  if (floatHarmText != null) {
                      floatHarmText.setText("Гарм: " + harmonyNames[index]);
                  }
                  for (int i = 0; i < harmonyButtons.length; i++) {
                      if (i == index) {
                          harmonyButtons[i].setBackground(createRoundedRect(COLOR_PRIMARY, 20, 0, 0));
                          harmonyButtons[i].setTextColor(COLOR_ON_PRIMARY);
                          harmonyButtons[i].setTypeface(Typeface.DEFAULT_BOLD);
                      } else {
                          harmonyButtons[i].setBackground(createRoundedRect(COLOR_CARD_HIGHLIGHT, 20, Color.parseColor("#49454F"), 1));
                          harmonyButtons[i].setTextColor(COLOR_TEXT);
                          harmonyButtons[i].setTypeface(Typeface.DEFAULT);
                      }
                  }
              }

              private LinearLayout createCard() {
                  LinearLayout card = new LinearLayout(this);
                  card.setOrientation(LinearLayout.VERTICAL);
                  card.setPadding(dp(18), dp(16), dp(18), dp(16));
                  card.setBackground(createRoundedRect(COLOR_CARD, 24, Color.parseColor("#2B2930"), 1));
                  return card;
              }

              private void addSpacer(LinearLayout parent, int heightDp) {
                  View v = new View(this);
                  v.setLayoutParams(new LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, dp(heightDp)));
                  parent.addView(v);
              }

              private interface SliderCallback {
                  void onValueChanged(int progress);
              }

              private SeekBar addSlider(LinearLayout parent, String label, int initial, int max, final String suffix, final SliderCallback callback) {
                  LinearLayout row = new LinearLayout(this);
                  row.setOrientation(LinearLayout.HORIZONTAL);

                  TextView title = new TextView(this);
                  title.setText(label);
                  title.setTextColor(COLOR_TEXT);
                  title.setTextSize(14f);
                  title.setLayoutParams(new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f));

                  final TextView valText = new TextView(this);
                  valText.setText(initial + suffix);
                  valText.setTextColor(COLOR_PRIMARY);
                  valText.setTextSize(14f);
                  valText.setTypeface(Typeface.DEFAULT_BOLD);

                  row.addView(title);
                  row.addView(valText);
                  parent.addView(row);

                  addSpacer(parent, 6);

                  SeekBar seekBar = new SeekBar(this);
                  seekBar.setMax(max);
                  seekBar.setProgress(initial);
                  seekBar.setProgressTintList(ColorStateList.valueOf(COLOR_PRIMARY));
                  seekBar.setThumbTintList(ColorStateList.valueOf(COLOR_PRIMARY));
                  seekBar.setProgressBackgroundTintList(ColorStateList.valueOf(COLOR_CARD_HIGHLIGHT));
                  seekBar.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {
                      @Override
                      public void onProgressChanged(SeekBar sb, int progress, boolean fromUser) {
                          valText.setText(progress + suffix);
                          callback.onValueChanged(progress);
                      }
                      @Override public void onStartTrackingTouch(SeekBar sb) {}
                      @Override public void onStopTrackingTouch(SeekBar sb) {}
                  });
                  parent.addView(seekBar);
                  return seekBar;
              }

              @Override
              protected void onDestroy() {
                  super.onDestroy();
                  uiHandler.removeCallbacks(levelUpdater);
                  removeFloatingMiniController();
                  if (isMonitoring) {
                      stopMonitoring();
                      stopService(new Intent(this, VocalService.class));
                      isMonitoring = false;
                  }
              }
          }
