      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VocalStudioPro-Karaoke-APK
          path: app/build/outputs/apk/debug/app-debug.apk
